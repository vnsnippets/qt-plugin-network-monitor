name: Build and Release Plugin

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libglib2.0-dev \
            qt6-base-dev \
            qt6-declarative-dev

      - name: 🏷️ Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          CLEAN_VERSION=${VERSION#v}
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $CLEAN_VERSION"

      - name: ⚙️ Configure CMake
        # Pointing CMake to the ./code directory as the source root
        run: |
          cmake -S code -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_VERSION=${{ steps.get_version.outputs.version }}

      - name: 🏗️ Build Plugin
        run: cmake --build build --config Release

      - name: 📦 Package Artifacts
        run: |
          cd build
          tar -cvzf ../NetworkMonitorDBusPlugin.tar.gz *NetworkMonitorDBusPlugin.so qmldir
          cd ..

      - name: 🚀 Upload to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.get_version.outputs.tag }} \
            NetworkMonitorDBusPlugin.tar.gz \
            --clobber

      - name: 📂 Upload Workflow Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NetworkMonitorDBusPlugin-${{ steps.get_version.outputs.version }}
          path: NetworkMonitorDBusPlugin.tar.gz